<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi · マネージャー</title>
    <script>(function(){var t;try{t=localStorage.getItem('zen-theme');}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'sumi':'washi');})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/zen.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <canvas class="petals" aria-hidden="true"></canvas>

    <nav class="rail" aria-label="Menu utama">
        <a href="index.html" class="rail-logo" lang="ja" aria-label="マネージャー, ke halaman Keuangan">マネージャー</a>
        <div class="rail-links">
            <a href="index.html" class="rail-link" aria-label="Keuangan" data-tip="Keuangan"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg></a>
            <a href="schedule.html" class="rail-link" aria-label="Jadwal &amp; tugas" data-tip="Jadwal &amp; tugas"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg></a>
            <a href="wishlist.html" class="rail-link" aria-label="Wishlist" data-tip="Wishlist"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg></a>
            <a href="hobbies.html" class="rail-link" aria-current="page" aria-label="Hobi" data-tip="Hobi"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg></a>
            <a href="dumpspaces.html" class="rail-link" aria-label="Dumpspaces" data-tip="Dumpspaces"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg></a>
            <a href="minigames.html" class="rail-link" aria-label="Sudoku" data-tip="Sudoku"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg></a>
        </div>
        <div class="rail-tools">
            <button type="button" class="tool-btn" id="btn-motion" aria-label="Gerak" data-tip="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals" aria-label="Kelopak" data-tip="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme" aria-label="Ganti ke mode malam" data-tip="Mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout" aria-label="Keluar" data-tip="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </nav>

    <header class="mobile-bar">
        <a href="index.html" class="mobile-logo" lang="ja">マネージャー</a>
        <div class="mobile-tools">
            <button type="button" class="tool-btn" id="btn-motion-m" aria-label="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals-m" aria-label="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme-m" aria-label="Ganti ke mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout-m" aria-label="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </header>

    <nav class="tabbar" aria-label="Menu utama">
        <a href="index.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg><span>Keuangan</span></a>
        <a href="schedule.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg><span>Jadwal</span></a>
        <a href="wishlist.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg><span>Wishlist</span></a>
        <a href="hobbies.html" class="tab" aria-current="page"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg><span>Hobi</span></a>
        <a href="dumpspaces.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg><span>Dumps</span></a>
        <a href="minigames.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg><span>Sudoku</span></a>
    </nav>


    <main class="main-content" id="main">
        <span class="watermark" lang="ja" aria-hidden="true">遊</span>
        <header class="page-head">
            <div class="page-title">
                <p class="eyebrow" id="page-eyebrow">Hobi</p>
                <h1>Hobi</h1>
                <p class="page-lede">Anime, film, series, game. Yang mau ditonton dan yang udah dikasih nilai.</p>
            </div>
            <span class="tategaki" lang="ja" aria-hidden="true">好きなことを</span>
            <button type="button" class="btn-add" onclick="openAddModal()">+ Tambah judul</button>
        </header>

        <div class="hobby-grid">
            <!-- Rak kartu tanpa bingkai: sampul kana jadi fokus -->
            <section aria-labelledby="rated-heading">
                <h2 id="rated-heading" class="section-title">Udah ditonton atau dimainin</h2>
                <div class="rating-grid" id="ratings-container"></div>
            </section>

            <section class="paper" aria-labelledby="watch-heading">
                <h2 id="watch-heading">Antrian</h2>
                <div id="watchlist-container" class="ledger"></div>
            </section>
        </div>
    </main>

    <div id="hobbyModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Tambah judul</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('hobbyModal')"><span aria-hidden="true">✕</span></button>
            </div>

            <div class="form-group">
                <label for="hobby-title">Judul</label>
                <input type="text" id="hobby-title" class="form-input" placeholder="Misal: One Piece, Interstellar">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="hobby-type">Kategori</label>
                    <select id="hobby-type" class="form-input">
                        <option value="Anime">Anime</option>
                        <option value="Movie">Film</option>
                        <option value="Series">Series</option>
                        <option value="Game">Game</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="hobby-status">Status</label>
                    <select id="hobby-status" class="form-input" onchange="toggleRatingArea()">
                        <option value="Plan to Watch">Mau ditonton / dimainin</option>
                        <option value="Completed">Udah selesai</option>
                    </select>
                </div>
            </div>

            <div id="rating-area" class="rating-area" hidden>
                <div class="form-group">
                    <label for="hobby-rating">Nilai</label>
                    <select id="hobby-rating" class="form-input">
                        <option value="5">★★★★★ Juara</option>
                        <option value="4">★★★★☆ Bagus banget</option>
                        <option value="3">★★★☆☆ Oke</option>
                        <option value="2">★★☆☆☆ Biasa aja</option>
                        <option value="1">★☆☆☆☆ Nyesel</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="hobby-review">Review singkat</label>
                    <textarea id="hobby-review" class="form-input" rows="3" placeholder="Tulis kesan lu di sini"></textarea>
                </div>
            </div>

            <div class="modal-actions split">
                <button type="button" class="btn-cancel danger" id="btn-delete-hobby" hidden onclick="triggerDeleteHobby()">Hapus</button>
                <div class="group">
                    <button type="button" class="btn-cancel" onclick="closeModal('hobbyModal')">Batal</button>
                    <button type="button" class="btn-submit" id="btn-save-hobby" onclick="saveHobby()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/theme.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/petals.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/hobbies.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
</body>
</html>
