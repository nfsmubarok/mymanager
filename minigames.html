<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item active">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Zen Sudoku</h1>
                <p>Latih fokus lu. Isi kotak kosong dengan angka 1-9.</p>
            </div>
        </div>

        <div class="game-container" style="max-width: 400px; padding: 20px;">
            <!-- Pilihan Level -->
            <div style="width: 100%; margin-bottom: 15px;">
                <select id="sudoku-level" class="form-input" style="font-weight: bold; cursor: pointer; text-align: center; background-color: var(--bg-white);" onchange="generateSudoku()">
                    <option value="30">Level 1 - Easy</option>
                    <option value="45" selected>Level 2 - Medium</option>
                    <option value="55">Level 3 - Hard</option>
                </select>
            </div>

            <!-- UI Nyawa / Lives -->
            <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; font-size: 16px; font-weight: bold; color: var(--text-dark);">
                <span>Mistakes:</span>
                <span id="lives-display" style="letter-spacing: 2px;">❤️❤️❤️</span>
            </div>
            
            <div id="sudoku-board" class="sudoku-grid"></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px; width: 100%;">
                <button class="btn-submit" style="width: 100%;" onclick="generateSudoku()">🔄 Restart Game</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/minigames.js"></script>
</body>
</html>
