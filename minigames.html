<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item active">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Zen Dino</h1>
                <p>Press Space or Tap the screen to jump.</p>
            </div>
            <h2 id="dino-score" style="color: var(--text-dark); font-size: 24px;">Score: 0</h2>
        </div>
        

        <div class="game-container">
            <div id="dino-game" onclick="jump()">
                <div id="dino">🦖</div>
                <div id="obstacle">🌵</div>
                
                <div id="game-over-modal" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245,245,240,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 100;">
                    <h2 style="color: var(--sakura-pink); margin-bottom: 10px; font-size: 24px;">GAME OVER</h2>
                    <p style="margin-bottom: 15px; color: var(--text-dark);">Final Score: <span id="final-score" style="font-weight: bold;">0</span></p>
                </div>
            </div>
            <button class="btn-start" style="margin-top: 30px; background: var(--matcha-green); color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;" onclick="startGame(); this.blur();">Start Game</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/minigames.js"></script>
</body>
</html>
