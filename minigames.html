<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku · マネージャー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <aside class="sidebar">
        <div class="logo" lang="ja">マネージャー</div>
        <nav aria-label="Menu utama">
            <div class="menu-group">
                <p class="menu-title">Harian</p>
                <a href="index.html" class="menu-item">Keuangan</a>
                <a href="schedule.html" class="menu-item">Jadwal &amp; tugas</a>
                <a href="wishlist.html" class="menu-item">Wishlist</a>
            </div>
            <div class="menu-group">
                <p class="menu-title">Santai &amp; catatan</p>
                <a href="hobbies.html" class="menu-item">Hobi</a>
                <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
                <a href="minigames.html" class="menu-item active" aria-current="page">Sudoku</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-logout" id="btn-logout">Keluar</button>
        </div>
    </aside>

    <main class="main-content" id="main">
        <header class="header">
            <div>
                <h1>Sudoku <span class="jp" lang="ja" aria-hidden="true">数独</span></h1>
                <p>Latih fokus lu. Isi kotak kosong pakai angka 1 sampai 9.</p>
            </div>
        </header>

        <div class="game-container">
            <div class="form-group game-level">
                <label for="sudoku-level">Tingkat kesulitan</label>
                <select id="sudoku-level" class="form-input" onchange="generateSudoku()">
                    <option value="30">Gampang</option>
                    <option value="45" selected>Sedang</option>
                    <option value="55">Susah</option>
                </select>
            </div>

            <div class="game-bar">
                <span>Nyawa</span>
                <span id="lives-display" class="lives" aria-live="polite"></span>
            </div>

            <div id="sudoku-board" class="sudoku-grid" role="group" aria-label="Papan sudoku 9 kali 9"></div>
            <p id="game-status" class="game-status" role="status" aria-live="polite"></p>

            <button type="button" class="btn-submit btn-block" onclick="generateSudoku()">Ulang dari awal</button>
        </div>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/minigames.js"></script>
</body>
</html>
