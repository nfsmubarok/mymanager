<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-box">
        <div class="logo">マネージャー</div>
        <div class="subtitle" id="form-subtitle">Welcome back! Please login.</div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="auth-email" class="form-input" placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••">
        </div>

        <button class="btn-auth" id="btn-submit" onclick="handleAuth()">Login</button>

        <div style="text-align: center; margin: 15px 0;">
            <span style="font-size: 12px; color: var(--text-muted); font-weight: bold;">OR</span>
        </div>
        <button class="btn-auth" style="background: var(--matcha-green); margin-top: 0;" onclick="loginAsDemo()">Try Demo Account</button>
        <div class="toggle-text" id="toggle-container">

        <div class="toggle-text" id="toggle-container">
            Don't have an account? <span onclick="toggleMode()">Sign Up</span>
        </div>
    </div>

    <div id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://pbvjxiyijesakcnywgdv.supabase.co';
        const supabaseKey = 'sb_publishable_2yVPX7xdB2PnDNR3Pi4R-A_acaqtDH3';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLoginMode = true;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.backgroundColor = isError ? 'var(--sakura-pink)' : 'var(--matcha-green)';
            t.style.bottom = '30px'; t.style.opacity = '1';
            setTimeout(() => { t.style.bottom = '-50px'; t.style.opacity = '0'; }, 3000);
        }

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('btn-submit').innerText = isLoginMode ? 'Login' : 'Create Account';
            document.getElementById('form-subtitle').innerText = isLoginMode ? 'Welcome back! Please login.' : 'Create a new account to get started.';
            document.getElementById('toggle-container').innerHTML = isLoginMode 
                ? 'Don\'t have an account? <span onclick="toggleMode()">Sign Up</span>' 
                : 'Already have an account? <span onclick="toggleMode()">Login</span>';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('btn-submit');

            if(!email || !password) { showToast("Email & Password wajib diisi!", true); return; }

            btn.disabled = true;
            btn.innerText = "Processing...";

            if(isLoginMode) {
                // Proses Login
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if(error) {
                    showToast(error.message, true);
                    btn.disabled = false; btn.innerText = "Login";
                } else {
                    showToast("Login berhasil! Mengalihkan...");
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                }
            } else {
                // Proses Register
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if(error) {
                    showToast(error.message, true);
                    btn.disabled = false; btn.innerText = "Create Account";
                } else {
                    showToast("Akun berhasil dibuat! Silakan Login.");
                    toggleMode();
                    btn.disabled = false;
                }
            }
        }

        // Fungsi Khusus Tombol Demo
        async function loginAsDemo() {
            showToast("Memasuki Akun Demo...");
            
            // Ganti email dan password ini SESUAI yang lu bikin di Supabase tadi
            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email: 'demo@zendash.com', 
                password: 'demo123' 
            });

            if(error) {
                showToast("Gagal login demo: " + error.message, true);
            } else {
                showToast("Selamat datang di Demo! Mengalihkan...");
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            }
        }

        // Cek kalau udah login, otomatis pindah ke index.html
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if(session) window.location.href = 'index.html';
        }
    </script>
</body>
</html>
