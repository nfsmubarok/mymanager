<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item active">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Wishlist Tracker</h1>
                <p>Plan your dreams, step by step.</p>
            </div>
            <button class="btn-add" onclick="openAddModal()">+ Add New Wish</button>
        </div>

        <div class="wishlist-grid" id="wishlist-container">
            </div>
    </div>

    <div id="addWishModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Wish</h2>
                <button class="close-btn" onclick="closeModal('addWishModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Wish Title</label>
                <input type="text" id="wish-title" class="form-input" placeholder="e.g., Build Campervan, PC Rakitan">
            </div>
            <div class="form-group">
                <label>Target Budget (Rp)</label>
                <input type="number" id="wish-target" class="form-input" placeholder="e.g., 15000000">
            </div>
            <div class="form-group">
                <label>Current Saved (Rp)</label>
                <input type="number" id="wish-current" class="form-input" placeholder="e.g., 0" value="0">
            </div>
            <div class="form-group">
                <label>Action Plans (1 plan per baris)</label>
                <textarea id="wish-plans" class="form-input" rows="4" placeholder="Nabung 2 juta per bulan&#10;Riset harga barang&#10;Cicil beli parts"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('addWishModal')">Cancel</button>
                <button class="btn-submit" onclick="saveNewWish()">Save Wish</button>
            </div>
        </div>
    </div>

    <div id="editWishModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Update Progress</h2>
                <button class="close-btn" onclick="closeModal('editWishModal')">✕</button>
            </div>
            
            <div class="form-group">
                <label>Update Saved Amount (Rp)</label>
                <input type="number" id="edit-wish-current" class="form-input">
                <p style="font-size: 11px; margin-top: 4px; color: var(--text-muted);" id="edit-wish-target-hint">Target: Rp 0</p>
            </div>

            <div class="form-group">
                <label>Action Plans Check</label>
                <div class="edit-checklist" id="edit-wish-plans">
                    </div>
            </div>

            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn-cancel" style="color: var(--sakura-pink); border-color: var(--sakura-pink);" onclick="triggerDeleteWish()">Delete Wish</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-cancel" onclick="closeModal('editWishModal')">Cancel</button>
                    <button class="btn-submit" onclick="saveEditWish()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 1001;">
        <div class="modal-content" style="width: 350px; text-align: center; padding: 40px 30px;">
            <div style="font-size: 32px; margin-bottom: 10px;">🗑️</div>
            <h3 style="margin-bottom: 10px; color: var(--text-dark); font-size: 18px;">Are you sure?</h3>
            <p id="confirm-msg" style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">Yakin mau hapus ini?</p>
            <div style="display: flex; justify-content: center; gap: 12px;">
                <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn-submit" style="background-color: var(--sakura-pink);" onclick="executeConfirm()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. INIT SUPABASE (Udah Bener & Dipindah ke bawah)
        const supabaseUrl = 'https://pbvjxiyijesakcnywgdv.supabase.co';
        const supabaseKey = 'sb_publishable_2yVPX7xdB2PnDNR3Pi4R-A_acaqtDH3';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. DATA UTAMA (Bersih)
        let wishlists = JSON.parse(localStorage.getItem('finzen_wishlists')) || [];
        let activeEditId = null; 

        // Helper Format Rupiah
        function formatRp(angka) {
            if(angka >= 1000000) {
                return "Rp " + (angka / 1000000).toFixed(1).replace('.0', '') + " Jt";
            }
            return "Rp " + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }
        function formatRpFull(angka) {
            return "Rp " + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // Render UI
        function renderWishlists() {
            const container = document.getElementById('wishlist-container');
            container.innerHTML = '';

            if (wishlists.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 24px; display: block; margin-bottom: 10px;">✨</span>
                        Belum ada impian yang dicatat. Yuk tambahin targetmu!
                    </div>`;
                return;
            }

            wishlists.forEach(wish => {
                let percent = wish.targetAmount > 0 ? (wish.currentAmount / wish.targetAmount) * 100 : 0;
                if (percent > 100) percent = 100;
                
                let plansHtml = '';
                if(wish.plans && wish.plans.length > 0) {
                    plansHtml = '<h4 style="font-size: 12px; margin-bottom: 8px; text-transform:uppercase; color: var(--text-dark);">Action Plan</h4><ul class="plan-list">';
                    const displayPlans = wish.plans.slice(0, 3);
                    displayPlans.forEach(plan => {
                        const doneClass = plan.done ? 'class="done"' : '';
                        plansHtml += `<li ${doneClass}>${plan.text}</li>`;
                    });
                    if(wish.plans.length > 3) {
                        plansHtml += `<li><i style="opacity: 0.6;">+ ${wish.plans.length - 3} more...</i></li>`;
                    }
                    plansHtml += '</ul>';
                }

                const barColor = percent >= 100 ? 'var(--ocean-blue)' : 'var(--matcha-green)';
                const borderTop = percent >= 100 ? 'var(--ocean-blue)' : 'var(--matcha-green)';

                container.innerHTML += `
                    <div class="box" style="border-top: 4px solid ${borderTop};" onclick="openEditModal(${wish.id})">
                        <div class="box-header">
                            <h3 style="font-size: 18px; display:flex; align-items:center; gap:8px;">
                                ${percent >= 100 ? '🎉' : '🎯'} ${wish.title}
                            </h3>
                            <span class="price-badge">${formatRp(wish.targetAmount)}</span>
                        </div>
                        
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <p style="font-size: 13px; color: var(--text-dark); font-weight:600;">
                                Progress: ${formatRp(wish.currentAmount)}
                            </p>
                            <p style="font-size: 13px; font-weight: bold; color: ${barColor};">${Math.floor(percent)}%</p>
                        </div>
                        
                        <div class="stat-bar-bg">
                            <div class="stat-bar-fill" style="width: ${percent}%; background: ${barColor};"></div>
                        </div>
                        
                        ${plansHtml}
                    </div>
                `;
            });
        }

        // Add Modal
        function openAddModal() {
            document.getElementById('wish-title').value = '';
            document.getElementById('wish-target').value = '';
            document.getElementById('wish-current').value = '0';
            document.getElementById('wish-plans').value = '';
            openModal('addWishModal');
        }
        // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Usir ke halaman login
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }
// --- FUNGSI NARIK DATA DARI CLOUD ---
        async function fetchCloudData() {
            // 1. Ambil data wallets dari Supabase
            const { data: dbWallets } = await supabaseClient.from('wallets').select('*');
            if (dbWallets && dbWallets.length > 0) {
                wallets = dbWallets;
                localStorage.setItem('finzen_wallets', JSON.stringify(wallets));
            }

            // 2. Ambil data transactions dari Supabase
            const { data: dbTx } = await supabaseClient.from('transactions').select('*');
            if (dbTx) {
                transactions = dbTx;
                localStorage.setItem('finzen_tx', JSON.stringify(transactions));
            }

            // 3. Render layarnya
            updateDashboard();
        }

        // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                // KALAU SUDAH LOGIN, TARIK DATA DARI CLOUD!
                fetchCloudData();
            }
        }

        // Jalankan pas halaman dibuka
        window.onload = () => { 
            document.getElementById('filter-month').value = new Date().getMonth();
            checkAuth(); 
        };
        // Panggil checkAuth pas halaman dibuka
        checkAuth();
        async function saveNewWish() {
            const title = document.getElementById('wish-title').value;
            const targetAmount = parseInt(document.getElementById('wish-target').value);
            const currentAmount = parseInt(document.getElementById('wish-current').value) || 0;
            const plansText = document.getElementById('wish-plans').value;

            if(!title || isNaN(targetAmount)) {
                alert("Title dan Target Budget wajib diisi!"); return;
            }

            let plansArray = [];
            if(plansText.trim() !== '') {
                plansArray = plansText.split('\n').filter(p => p.trim() !== '').map((text, index) => {
                    return { id: index, text: text.trim(), done: false };
                });
            }

            // Insert ke Supabase
            const { error } = await supabaseClient
                .from('wishlists')
                .insert([{ 
                    title: title, 
                    target_amount: targetAmount, 
                    current_amount: currentAmount,
                    plans: JSON.stringify(plansArray) // Dirubah jadi string JSON biar aman masuk database
                }]);

            if (error) {
                console.error("Error dari Supabase:", error);
                alert("Gagal simpan wishlist ke database cloud! Cek console F12.");
            } else {
                const newWish = { id: Date.now(), title, targetAmount, currentAmount, plans: plansArray };
                wishlists.push(newWish);
                localStorage.setItem('finzen_wishlists', JSON.stringify(wishlists));
                
                closeModal('addWishModal');
                renderWishlists();
            }
        }

        // Edit Modal
        function openEditModal(id) {
            const wish = wishlists.find(w => w.id === id);
            if(!wish) return;

            activeEditId = id;
            document.getElementById('edit-modal-title').innerText = wish.title;
            document.getElementById('edit-wish-current').value = wish.currentAmount;
            document.getElementById('edit-wish-target-hint').innerText = `Target total: ${formatRpFull(wish.targetAmount)}`;

            const checklistContainer = document.getElementById('edit-wish-plans');
            checklistContainer.innerHTML = '';
            
            if(wish.plans && wish.plans.length > 0) {
                wish.plans.forEach(plan => {
                    const checked = plan.done ? 'checked' : '';
                    checklistContainer.innerHTML += `
                        <label class="checklist-item">
                            <input type="checkbox" id="plan-${plan.id}" ${checked}>
                            <span style="${plan.done ? 'text-decoration:line-through; opacity:0.6;' : ''}">${plan.text}</span>
                        </label>
                    `;
                });
            } else {
                checklistContainer.innerHTML = '<p style="font-size: 12px; color: var(--text-muted);">Tidak ada action plan.</p>';
            }

            openModal('editWishModal');
        }

        function saveEditWish() {
            const wishIndex = wishlists.findIndex(w => w.id === activeEditId);
            if(wishIndex === -1) return;

            const newAmount = parseInt(document.getElementById('edit-wish-current').value) || 0;
            wishlists[wishIndex].currentAmount = newAmount;

            if(wishlists[wishIndex].plans) {
                wishlists[wishIndex].plans.forEach(plan => {
                    const checkbox = document.getElementById(`plan-${plan.id}`);
                    if(checkbox) { plan.done = checkbox.checked; }
                });
            }

            localStorage.setItem('finzen_wishlists', JSON.stringify(wishlists));
            closeModal('editWishModal');
            renderWishlists();
        }

        // Custom Confirm & Delete Logic
        let confirmAction = null; 
        
        function customConfirm(message, actionCallback) {
            document.getElementById('confirm-msg').innerText = message;
            confirmAction = actionCallback; 
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function executeConfirm() {
            if(confirmAction) {
                confirmAction(); 
                confirmAction = null; 
            }
            closeModal('confirmModal');
        }

        function triggerDeleteWish() {
            customConfirm(`Yakin mau menghapus wishlist ini?`, () => {
                wishlists = wishlists.filter(w => w.id !== activeEditId);
                localStorage.setItem('finzen_wishlists', JSON.stringify(wishlists));
                
                closeModal('editWishModal');
                renderWishlists();
            });
        }

        // Modal Base Logic
        function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        
        window.onclick = function(event) { 
            if (event.target.classList.contains('modal-overlay')) { 
                event.target.style.display = "none"; 
            } 
        }

        // Initial Render
        window.onload = () => { renderWishlists(); };
    </script>
</body>
</html>
