<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist · マネージャー</title>
    <script>(function(){var t;try{t=localStorage.getItem('zen-theme');}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'sumi':'washi');})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/zen.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <canvas class="petals" aria-hidden="true"></canvas>

    <nav class="rail" aria-label="Menu utama">
        <a href="index.html" class="rail-logo" lang="ja" aria-label="マネージャー, ke halaman Keuangan">マネージャー</a>
        <div class="rail-links">
            <a href="index.html" class="rail-link" aria-label="Keuangan" data-tip="Keuangan"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg></a>
            <a href="schedule.html" class="rail-link" aria-label="Jadwal &amp; tugas" data-tip="Jadwal &amp; tugas"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg></a>
            <a href="wishlist.html" class="rail-link" aria-current="page" aria-label="Wishlist" data-tip="Wishlist"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg></a>
            <a href="hobbies.html" class="rail-link" aria-label="Hobi" data-tip="Hobi"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg></a>
            <a href="dumpspaces.html" class="rail-link" aria-label="Dumpspaces" data-tip="Dumpspaces"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg></a>
            <a href="minigames.html" class="rail-link" aria-label="Sudoku" data-tip="Sudoku"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg></a>
        </div>
        <div class="rail-tools">
            <button type="button" class="tool-btn" id="btn-motion" aria-label="Gerak" data-tip="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals" aria-label="Kelopak" data-tip="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme" aria-label="Ganti ke mode malam" data-tip="Mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout" aria-label="Keluar" data-tip="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </nav>

    <header class="mobile-bar">
        <a href="index.html" class="mobile-logo" lang="ja">マネージャー</a>
        <div class="mobile-tools">
            <button type="button" class="tool-btn" id="btn-motion-m" aria-label="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals-m" aria-label="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme-m" aria-label="Ganti ke mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout-m" aria-label="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </header>

    <nav class="tabbar" aria-label="Menu utama">
        <a href="index.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg><span>Keuangan</span></a>
        <a href="schedule.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg><span>Jadwal</span></a>
        <a href="wishlist.html" class="tab" aria-current="page"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg><span>Wishlist</span></a>
        <a href="hobbies.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg><span>Hobi</span></a>
        <a href="dumpspaces.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg><span>Dumps</span></a>
        <a href="minigames.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg><span>Sudoku</span></a>
    </nav>


    <main class="main-content" id="main">
        <span class="watermark" lang="ja" aria-hidden="true">願</span>
        <header class="page-head">
            <div class="page-title">
                <p class="eyebrow" id="page-eyebrow">Wishlist</p>
                <h1>Wishlist</h1>
                <p class="page-lede">Barang impian, dicicil pelan-pelan sampai kebeli.</p>
            </div>
            <span class="tategaki" lang="ja" aria-hidden="true">願いを叶える</span>
            <button type="button" class="btn-add" onclick="openAddModal()">+ Tambah wishlist</button>
        </header>

        <div class="wishlist-grid" id="wishlist-container"></div>
    </main>

    <div id="addWishModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="add-wish-title">
            <div class="modal-header">
                <h2 id="add-wish-title">Tambah wishlist</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('addWishModal')"><span aria-hidden="true">✕</span></button>
            </div>
            <div class="form-group">
                <label for="wish-title">Mau beli apa?</label>
                <input type="text" id="wish-title" class="form-input" placeholder="Misal: PC rakitan">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="wish-target">Target dana (Rp)</label>
                    <input type="number" id="wish-target" class="form-input" inputmode="numeric" min="0" placeholder="15000000">
                </div>
                <div class="form-group">
                    <label for="wish-current">Udah terkumpul (Rp)</label>
                    <input type="number" id="wish-current" class="form-input" inputmode="numeric" min="0" value="0">
                </div>
            </div>
            <div class="form-group">
                <label for="wish-plans">Rencana (satu per baris)</label>
                <textarea id="wish-plans" class="form-input" rows="4" placeholder="Nabung 2 juta per bulan&#10;Riset harga&#10;Cicil beli parts"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('addWishModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-wish" onclick="saveNewWish()">Simpan</button>
            </div>
        </div>
    </div>

    <div id="editWishModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
            <div class="modal-header">
                <h2 id="edit-modal-title">Update progres</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('editWishModal')"><span aria-hidden="true">✕</span></button>
            </div>

            <div class="form-group">
                <label for="edit-wish-current">Udah terkumpul (Rp)</label>
                <input type="number" id="edit-wish-current" class="form-input" inputmode="numeric" min="0">
                <p class="form-hint" id="edit-wish-target-hint">Target: Rp 0</p>
            </div>

            <fieldset class="form-group">
                <legend class="form-label">Rencana yang udah jalan</legend>
                <div id="edit-wish-plans"></div>
            </fieldset>

            <div class="modal-actions split">
                <button type="button" class="btn-cancel danger" onclick="triggerDeleteWish()">Hapus wishlist</button>
                <div class="group">
                    <button type="button" class="btn-cancel" onclick="closeModal('editWishModal')">Batal</button>
                    <button type="button" class="btn-submit" id="btn-update-wish" onclick="saveEditWish()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/theme.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/petals.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
</body>
</html>
