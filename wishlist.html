<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item active">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Wishlist Tracker</h1>
                <p>Plan your dreams, step by step.</p>
            </div>
            <button class="btn-add" onclick="openAddModal()">+ Add New Wish</button>
        </div>

        <div class="wishlist-grid" id="wishlist-container">
            </div>
    </div>

    <div id="addWishModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Wish</h2>
                <button class="close-btn" onclick="closeModal('addWishModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Wish Title</label>
                <input type="text" id="wish-title" class="form-input" placeholder="e.g., Build Campervan, PC Rakitan">
            </div>
            <div class="form-group">
                <label>Target Budget (Rp)</label>
                <input type="number" id="wish-target" class="form-input" placeholder="e.g., 15000000">
            </div>
            <div class="form-group">
                <label>Current Saved (Rp)</label>
                <input type="number" id="wish-current" class="form-input" placeholder="e.g., 0" value="0">
            </div>
            <div class="form-group">
                <label>Action Plans (1 plan per baris)</label>
                <textarea id="wish-plans" class="form-input" rows="4" placeholder="Nabung 2 juta per bulan&#10;Riset harga barang&#10;Cicil beli parts"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('addWishModal')">Cancel</button>
                <button class="btn-submit" onclick="saveNewWish()">Save Wish</button>
            </div>
        </div>
    </div>

    <div id="editWishModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="edit-modal-title">Update Progress</h2>
                <button class="close-btn" onclick="closeModal('editWishModal')">✕</button>
            </div>
            
            <div class="form-group">
                <label>Update Saved Amount (Rp)</label>
                <input type="number" id="edit-wish-current" class="form-input">
                <p style="font-size: 11px; margin-top: 4px; color: var(--text-muted);" id="edit-wish-target-hint">Target: Rp 0</p>
            </div>

            <div class="form-group">
                <label>Action Plans Check</label>
                <div class="edit-checklist" id="edit-wish-plans">
                    </div>
            </div>

            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn-cancel" style="color: var(--sakura-pink); border-color: var(--sakura-pink);" onclick="triggerDeleteWish()">Delete Wish</button>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-cancel" onclick="closeModal('editWishModal')">Cancel</button>
                    <button class="btn-submit" onclick="saveEditWish()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 1001;">
        <div class="modal-content" style="width: 350px; text-align: center; padding: 40px 30px;">
            <div style="font-size: 32px; margin-bottom: 10px;">🗑️</div>
            <h3 style="margin-bottom: 10px; color: var(--text-dark); font-size: 18px;">Are you sure?</h3>
            <p id="confirm-msg" style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">Yakin mau hapus ini?</p>
            <div style="display: flex; justify-content: center; gap: 12px;">
                <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn-submit" style="background-color: var(--sakura-pink);" onclick="executeConfirm()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/wishlist.js"></script>
</body>
</html>
