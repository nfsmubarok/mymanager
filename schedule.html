<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal &amp; tugas · マネージャー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <aside class="sidebar">
        <div class="logo" lang="ja">マネージャー</div>
        <nav aria-label="Menu utama">
            <div class="menu-group">
                <p class="menu-title">Harian</p>
                <a href="index.html" class="menu-item">Keuangan</a>
                <a href="schedule.html" class="menu-item active" aria-current="page">Jadwal &amp; tugas</a>
                <a href="wishlist.html" class="menu-item">Wishlist</a>
            </div>
            <div class="menu-group">
                <p class="menu-title">Santai &amp; catatan</p>
                <a href="hobbies.html" class="menu-item">Hobi</a>
                <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
                <a href="minigames.html" class="menu-item">Sudoku</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-logout" id="btn-logout">Keluar</button>
        </div>
    </aside>

    <main class="main-content" id="main">
        <header class="header">
            <div>
                <h1>Jadwal &amp; tugas <span class="jp" lang="ja" aria-hidden="true">予定</span></h1>
                <p>Satu-satu aja. Yang penting ga ada yang kelupaan.</p>
            </div>
            <button type="button" class="btn-add" onclick="openModal('scheduleModal')">+ Tambah jadwal</button>
        </header>

        <div class="content-grid">
            <section class="box" aria-labelledby="month-display">
                <div class="calendar-header-nav">
                    <h2 id="month-display" aria-live="polite">Kalender</h2>
                    <div>
                        <button type="button" class="nav-btn" onclick="changeMonth(-1)" aria-label="Bulan sebelumnya"><span aria-hidden="true">‹</span></button>
                        <button type="button" class="nav-btn" onclick="changeMonth(1)" aria-label="Bulan berikutnya"><span aria-hidden="true">›</span></button>
                    </div>
                </div>
                <div class="calendar-grid" aria-hidden="true">
                    <div class="day-name">Min</div><div class="day-name">Sen</div><div class="day-name">Sel</div>
                    <div class="day-name">Rab</div><div class="day-name">Kam</div><div class="day-name">Jum</div><div class="day-name">Sab</div>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </section>

            <div class="stack">
                <section class="box" aria-labelledby="today-heading">
                    <div class="box-header"><h2 id="today-heading">Jadwal hari ini</h2></div>
                    <div id="upcoming-list"></div>
                </section>

                <section class="box" aria-labelledby="task-heading">
                    <div class="box-header">
                        <h2 id="task-heading">Daftar tugas</h2>
                        <button type="button" class="btn-small" onclick="openModal('taskModal')">+ Tugas</button>
                    </div>
                    <div id="task-list"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="dailyModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="daily-modal-title">
            <div class="modal-header">
                <h2 id="daily-modal-title">Jadwal</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('dailyModal')"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="daily-schedule-list"></div>
            <div class="modal-actions">
                <button type="button" class="btn-submit btn-block" onclick="openAddFromDaily()">+ Tambah jadwal di tanggal ini</button>
            </div>
        </div>
    </div>

    <div id="scheduleModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
            <div class="modal-header"><h2 id="schedule-modal-title">Tambah jadwal</h2><button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('scheduleModal')"><span aria-hidden="true">✕</span></button></div>
            <div class="form-group"><label for="sch-title">Nama acara</label><input type="text" id="sch-title" class="form-input" placeholder="Misal: ketemu dosen"></div>
            <div class="form-row">
                <div class="form-group"><label for="sch-date">Tanggal</label><input type="date" id="sch-date" class="form-input"></div>
                <div class="form-group"><label for="sch-time">Jam</label><input type="time" id="sch-time" class="form-input"></div>
            </div>
            <div class="form-group"><label for="sch-priority">Prioritas</label>
                <select id="sch-priority" class="form-input">
                    <option value="High">Tinggi</option>
                    <option value="Medium" selected>Sedang</option>
                    <option value="Low">Rendah</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('scheduleModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-schedule" onclick="saveSchedule()">Simpan jadwal</button>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-header"><h2 id="task-modal-title">Tambah tugas</h2><button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('taskModal')"><span aria-hidden="true">✕</span></button></div>
            <div class="form-group"><label for="task-name">Nama tugas</label><input type="text" id="task-name" class="form-input" placeholder="Misal: beli tiket konser"></div>
            <div class="form-group"><label for="task-deadline">Deadline</label><input type="date" id="task-deadline" class="form-input"></div>
            <div class="form-group"><label for="task-priority">Prioritas</label>
                <select id="task-priority" class="form-input">
                    <option value="High">Tinggi</option>
                    <option value="Medium" selected>Sedang</option>
                    <option value="Low">Rendah</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('taskModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-task" onclick="saveTask()">Simpan tugas</button>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
