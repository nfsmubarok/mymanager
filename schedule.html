<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item active">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Schedule & Planner</h1>
                <p>Prioritize your peace of mind.</p>
            </div>
            <button class="btn-add" onclick="openModal('scheduleModal')">+ Add Schedule</button>
        </div>

        <div class="content-grid">
            <div class="box">
                <div class="calendar-header-nav">
                    <h2 id="month-display">Bulan Tahun</h2>
                    <div>
                        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
                    </div>
                </div>
                <div class="calendar-grid">
                    <div class="day-name">Sun</div><div class="day-name">Mon</div><div class="day-name">Tue</div>
                    <div class="day-name">Wed</div><div class="day-name">Thu</div><div class="day-name">Fri</div><div class="day-name">Sat</div>
                </div>
                <div class="calendar-grid" id="calendar-days">
                </div>
            </div>

            <div>
                <div class="box">
                    <div class="box-header">
                        <h3>Today's Schedule</h3>
                    </div>
                    <div id="upcoming-list"></div>
                </div>

                <div class="box">
                    <div class="box-header">
                        <h3>Task List</h3>
                        <button class="btn-small" onclick="openModal('taskModal')">+ Add Task</button>
                    </div>
                    <div id="task-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="dailyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="daily-modal-title">Schedule</h2>
                <button class="close-btn" onclick="closeModal('dailyModal')">✕</button>
            </div>
            <div id="daily-schedule-list" style="margin-bottom: 20px;"></div>
            <div class="modal-actions" style="margin-top: 0;">
                <button class="btn-submit" style="width: 100%;" onclick="openAddFromDaily()">+ Add Schedule Here</button>
            </div>
        </div>
    </div>

    <div id="scheduleModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h2 id="schedule-modal-title">Add Schedule</h2><button class="close-btn" onclick="closeModal('scheduleModal')">✕</button></div>
            <div class="form-group"><label>Event Title</label><input type="text" id="sch-title" class="form-input" placeholder="e.g., Meeting Dosen"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Date</label><input type="date" id="sch-date" class="form-input"></div>
                <div class="form-group"><label>Time</label><input type="time" id="sch-time" class="form-input"></div>
            </div>
            <div class="form-group"><label>Priority</label>
                <select id="sch-priority" class="form-input">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('scheduleModal')">Cancel</button>
                <button class="btn-submit" onclick="saveSchedule()">Save Event</button>
            </div>
        </div>
    </div>
    
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h2>Add Task</h2><button class="close-btn" onclick="closeModal('taskModal')">✕</button></div>
            <div class="form-group"><label>Task Name</label><input type="text" id="task-name" class="form-input" placeholder="e.g., Beli tiket konser"></div>
            <div class="form-group"><label>Deadline</label><input type="date" id="task-deadline" class="form-input"></div>
            <div class="form-group"><label>Priority</label>
                <select id="task-priority" class="form-input">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('taskModal')">Cancel</button>
                <button class="btn-submit" onclick="saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. INIT SUPABASE (Udah Bener & Dipindah ke bawah)
        const supabaseUrl = 'https://pbvjxiyijesakcnywgdv.supabase.co';
        const supabaseKey = 'sb_publishable_2yVPX7xdB2PnDNR3Pi4R-A_acaqtDH3';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. STATE & DATA INITIALIZATION (Udah di-clear)
        let nav = 0; 
        let editingScheduleId = null;
        let selectedDateForNew = null; 
        
        let schedules = JSON.parse(localStorage.getItem('finzen_schedules')) || [];
        let tasks = JSON.parse(localStorage.getItem('finzen_tasks')) || [];

        const priorityColors = {
            'High': { hex: '#D98C8C', class: 'tag-high' },
            'Medium': { hex: '#7B9095', class: 'tag-medium' },
            'Low': { hex: '#8F9779', class: 'tag-low' }
        };

        // 3. CALENDAR LOGIC
        function loadCalendar() {
            const calendarDays = document.getElementById('calendar-days');
            const monthDisplay = document.getElementById('month-display');
            
            const dt = new Date();
            if (nav !== 0) { dt.setMonth(new Date().getMonth() + nav); }
            
            const day = dt.getDate();
            const month = dt.getMonth();
            const year = dt.getFullYear();

            monthDisplay.innerText = dt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

            const firstDayOfMonth = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const dateString = firstDayOfMonth.toLocaleDateString('en-US', { weekday: 'short' });
            
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const paddingDays = weekdays.indexOf(dateString);

            calendarDays.innerHTML = '';

            for (let i = 1; i <= paddingDays + daysInMonth; i++) {
                const daySquare = document.createElement('div');
                daySquare.classList.add('day-cell');

                if (i > paddingDays) {
                    const currentDay = i - paddingDays;
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(currentDay).padStart(2, '0')}`;
                    
                    daySquare.innerHTML = `<div class="day-number">${currentDay}</div>`;
                    daySquare.onclick = () => openDailyModal(dateStr);

                    const todayDate = new Date();
                    if (currentDay === todayDate.getDate() && month === todayDate.getMonth() && year === todayDate.getFullYear()) {
                        daySquare.classList.add('today');
                    }

                    const dayEvents = schedules.filter(sch => sch.date === dateStr);
                    dayEvents.forEach(event => {
                        const pColor = priorityColors[event.priority].hex;
                        const eventDiv = document.createElement('div');
                        eventDiv.classList.add('event-pill');
                        eventDiv.style.backgroundColor = pColor;
                        eventDiv.innerText = `${event.time} ${event.title}`;
                        eventDiv.title = event.title; 
                        daySquare.appendChild(eventDiv);
                    });
                } else {
                    daySquare.classList.add('muted');
                }
                calendarDays.appendChild(daySquare);
            }
        }

        function changeMonth(direction) { nav += direction; loadCalendar(); }

        // 4. DAILY VIEW & UPCOMING LOGIC
        function openDailyModal(dateStr) {
            document.getElementById('daily-modal-title').innerText = `Schedule: ${dateStr}`;
            selectedDateForNew = dateStr;
            
            const listDiv = document.getElementById('daily-schedule-list');
            listDiv.innerHTML = '';
            
            let dayEvents = schedules.filter(sch => sch.date === dateStr);
            dayEvents.sort((a,b) => a.time.localeCompare(b.time));

            if(dayEvents.length === 0) {
                listDiv.innerHTML = '<div class="empty-state">Kosong nih, gaada jadwal di tanggal ini.</div>';
            } else {
                dayEvents.forEach(event => {
                    const pColor = priorityColors[event.priority].hex;
                    listDiv.innerHTML += `
                        <div style="border-left: 3px solid ${pColor}; padding: 12px; background: #fafaf9; border-radius: 0 8px 8px 0; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <p style="font-weight: 600; font-size: 14px; color: var(--text-dark);">${event.time} - ${event.title}</p>
                                <span class="priority-tag" style="color:${pColor}; background: none; padding: 0; margin-top: 4px; display: inline-block;">${event.priority} Priority</span>
                            </div>
                            <div style="display:flex; gap:10px;">
                                <button onclick="editSchedule(${event.id})" style="background:var(--bg-rice); border:1px solid var(--border-color); border-radius: 4px; padding: 4px 6px; cursor:pointer;" title="Edit">✏️</button>
                                <button onclick="deleteSchedule(${event.id}, '${dateStr}')" style="background:var(--bg-rice); border:1px solid var(--border-color); border-radius: 4px; padding: 4px 6px; cursor:pointer;" title="Delete">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('dailyModal').style.display = 'flex';
        }

        function renderUpcoming() {
            const listDiv = document.getElementById('upcoming-list');
            listDiv.innerHTML = '';

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            let todayEvents = schedules.filter(sch => sch.date === todayStr);
            todayEvents.sort((a, b) => a.time.localeCompare(b.time));

            if (todayEvents.length === 0) {
                listDiv.innerHTML = '<div class="empty-state">No schedule for today. Relax! 🍵</div>';
            } else {
                todayEvents.forEach(event => {
                    const pColor = priorityColors[event.priority].hex;
                    listDiv.innerHTML += `
                        <div class="schedule-item" style="border-color: ${pColor};">
                            <div style="display: flex; justify-content: space-between; align-items:flex-start;">
                                <div>
                                    <p style="font-weight: 700; font-size: 14px; color: var(--text-dark);">${event.title}</p>
                                    <p style="font-size: 12px; color: ${pColor}; margin-top: 4px; font-weight:600;">${event.priority} Priority • ${event.time}</p>
                                </div>
                                <div style="display:flex; flex-direction:column; gap:4px;">
                                    <button onclick="editSchedule(${event.id})" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:12px;">✏️</button>
                                    <button onclick="deleteSchedule(${event.id})" style="background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:12px;">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function renderTasks() {
            const listDiv = document.getElementById('task-list');
            listDiv.innerHTML = '';
            if (tasks.length === 0) { listDiv.innerHTML = '<div class="empty-state">No tasks pending.</div>'; return; }

            tasks.sort((a, b) => {
                if(a.completed === b.completed) return new Date(a.deadline) - new Date(b.deadline);
                return a.completed ? 1 : -1;
            });

            tasks.forEach(task => {
                const pClass = priorityColors[task.priority].class;
                const checkedStr = task.completed ? 'checked' : '';
                const itemClass = task.completed ? 'task-item completed' : 'task-item';
                
                listDiv.innerHTML += `
                    <div class="${itemClass}">
                        <input type="checkbox" class="task-checkbox" ${checkedStr} onchange="toggleTask(${task.id})">
                        <div class="task-content">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <p class="task-title">${task.name}</p>
                                <span class="priority-tag ${pClass}">${task.priority}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <p style="font-size: 11px; color: var(--text-muted);">Deadline: ${task.deadline}</p>
                                <button onclick="deleteTask(${task.id})" style="background:none; border:none; font-size:12px; cursor:pointer; color:var(--text-muted);">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Usir ke halaman login
            }
        }
        // --- FUNGSI NARIK DATA DARI CLOUD ---
        async function fetchCloudData() {
            // 1. Ambil data wallets dari Supabase
            const { data: dbWallets } = await supabaseClient.from('wallets').select('*');
            if (dbWallets && dbWallets.length > 0) {
                wallets = dbWallets;
                localStorage.setItem('finzen_wallets', JSON.stringify(wallets));
            }

            // 2. Ambil data transactions dari Supabase
            const { data: dbTx } = await supabaseClient.from('transactions').select('*');
            if (dbTx) {
                transactions = dbTx;
                localStorage.setItem('finzen_tx', JSON.stringify(transactions));
            }

            // 3. Render layarnya
            updateDashboard();
        }

        // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                // KALAU SUDAH LOGIN, TARIK DATA DARI CLOUD!
                fetchCloudData();
            }
        }

        // Jalankan pas halaman dibuka
        window.onload = () => { 
            document.getElementById('filter-month').value = new Date().getMonth();
            checkAuth(); 
        };
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // Panggil checkAuth pas halaman dibuka
        checkAuth();
        // 5. SAVE KE SUPABASE & LOCAL
        function openAddFromDaily() {
            closeModal('dailyModal');
            openModal('scheduleModal');
            if(selectedDateForNew) { document.getElementById('sch-date').value = selectedDateForNew; }
        }

        function editSchedule(id) {
            let sch = schedules.find(s => s.id === id);
            if(sch) {
                editingScheduleId = id; 
                document.getElementById('schedule-modal-title').innerText = "Edit Schedule";
                document.getElementById('sch-title').value = sch.title;
                document.getElementById('sch-date').value = sch.date;
                document.getElementById('sch-time').value = sch.time;
                document.getElementById('sch-priority').value = sch.priority;
                
                closeModal('dailyModal');
                document.getElementById('scheduleModal').style.display = 'flex';
            }
        }

        async function saveSchedule() {
            const title = document.getElementById('sch-title').value;
            const date = document.getElementById('sch-date').value;
            const time = document.getElementById('sch-time').value;
            const priority = document.getElementById('sch-priority').value;

            if(!title || !date || !time) { alert("Isi semua datanya lengkap ya!"); return; }

            if(editingScheduleId) {
                // Proses Edit (Tanpa nembak ulang ke cloud biar simpel di sisi frontend, lu bisa upgrade nanti)
                let idx = schedules.findIndex(s => s.id === editingScheduleId);
                schedules[idx] = { id: editingScheduleId, title, date, time, priority };
                editingScheduleId = null; 
            } else {
                // Proses Nambah Baru ke Supabase
                const { error } = await supabaseClient
                    .from('schedules')
                    .insert([{ title, date, time, priority }]);

                if (error) {
                    console.error("Error dari Supabase:", error);
                    alert("Gagal simpan schedule ke database cloud! Cek console.");
                } else {
                    schedules.push({ id: Date.now(), title, date, time, priority });
                }
            }

            localStorage.setItem('finzen_schedules', JSON.stringify(schedules));
            closeModal('scheduleModal');
            loadCalendar();
            renderUpcoming();
            
            if(selectedDateForNew) openDailyModal(date);
        }

        function deleteSchedule(id, dateStr = null) {
            if(confirm('Yakin mau hapus jadwal ini?')) {
                schedules = schedules.filter(s => s.id !== id);
                localStorage.setItem('finzen_schedules', JSON.stringify(schedules));
                loadCalendar();
                renderUpcoming();
                if(dateStr) openDailyModal(dateStr);
            }
        }

        async function saveTask() {
            const name = document.getElementById('task-name').value;
            const deadline = document.getElementById('task-deadline').value;
            const priority = document.getElementById('task-priority').value;
            if(!name || !deadline) { alert("Nama task dan deadline harus diisi!"); return; }

            // Insert Task ke Supabase
            const { error } = await supabaseClient
                .from('tasks')
                .insert([{ name, deadline, priority, completed: false }]);

            if (error) {
                console.error("Error dari Supabase:", error);
                alert("Gagal simpan task ke cloud!");
            } else {
                tasks.push({ id: Date.now(), name, deadline, priority, completed: false });
                localStorage.setItem('finzen_tasks', JSON.stringify(tasks));
                closeModal('taskModal');
                renderTasks();
            }
        }

        function toggleTask(id) {
            let task = tasks.find(t => t.id === id);
            if(task) { 
                task.completed = !task.completed; 
                localStorage.setItem('finzen_tasks', JSON.stringify(tasks)); 
                renderTasks(); 
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('finzen_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // 6. MODAL CONTROLS
        function openModal(modalId) { 
            if(modalId === 'scheduleModal' && !editingScheduleId) {
                document.getElementById('schedule-modal-title').innerText = "Add Schedule";
                document.getElementById('sch-title').value = '';
                document.getElementById('sch-date').valueAsDate = new Date();
                document.getElementById('sch-time').value = '';
                selectedDateForNew = null; 
            }
            if(modalId === 'taskModal') {
                document.getElementById('task-name').value = '';
                document.getElementById('task-deadline').valueAsDate = new Date();
            }
            document.getElementById(modalId).style.display = 'flex'; 
        }
        function closeModal(modalId) { 
            document.getElementById(modalId).style.display = 'none'; 
            if(modalId === 'scheduleModal') editingScheduleId = null; 
        }
        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) { event.target.style.display = "none"; editingScheduleId = null; } }

        // INIT SAAT HALAMAN DIBUKA
        window.onload = () => {
            loadCalendar();
            renderUpcoming();
            renderTasks();
        };
    </script>
</body>
</html>
