<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item active">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item">Dumpspaces</a>
            <a href="minigames.html" class="menu-item">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Schedule & Planner</h1>
                <p>Prioritize your peace of mind.</p>
            </div>
            <button class="btn-add" onclick="openModal('scheduleModal')">+ Add Schedule</button>
        </div>

        <div class="content-grid">
            <div class="box">
                <div class="calendar-header-nav">
                    <h2 id="month-display">Bulan Tahun</h2>
                    <div>
                        <button class="nav-btn" onclick="changeMonth(-1)">❮</button>
                        <button class="nav-btn" onclick="changeMonth(1)">❯</button>
                    </div>
                </div>
                <div class="calendar-grid">
                    <div class="day-name">Sun</div><div class="day-name">Mon</div><div class="day-name">Tue</div>
                    <div class="day-name">Wed</div><div class="day-name">Thu</div><div class="day-name">Fri</div><div class="day-name">Sat</div>
                </div>
                <div class="calendar-grid" id="calendar-days">
                </div>
            </div>

            <div>
                <div class="box">
                    <div class="box-header">
                        <h3>Today's Schedule</h3>
                    </div>
                    <div id="upcoming-list"></div>
                </div>

                <div class="box">
                    <div class="box-header">
                        <h3>Task List</h3>
                        <button class="btn-small" onclick="openModal('taskModal')">+ Add Task</button>
                    </div>
                    <div id="task-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="dailyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="daily-modal-title">Schedule</h2>
                <button class="close-btn" onclick="closeModal('dailyModal')">✕</button>
            </div>
            <div id="daily-schedule-list" style="margin-bottom: 20px;"></div>
            <div class="modal-actions" style="margin-top: 0;">
                <button class="btn-submit" style="width: 100%;" onclick="openAddFromDaily()">+ Add Schedule Here</button>
            </div>
        </div>
    </div>

    <div id="scheduleModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h2 id="schedule-modal-title">Add Schedule</h2><button class="close-btn" onclick="closeModal('scheduleModal')">✕</button></div>
            <div class="form-group"><label>Event Title</label><input type="text" id="sch-title" class="form-input" placeholder="e.g., Meeting Dosen"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group"><label>Date</label><input type="date" id="sch-date" class="form-input"></div>
                <div class="form-group"><label>Time</label><input type="time" id="sch-time" class="form-input"></div>
            </div>
            <div class="form-group"><label>Priority</label>
                <select id="sch-priority" class="form-input">
                    <option value="High">High Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="Low">Low Priority</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('scheduleModal')">Cancel</button>
                <button class="btn-submit" onclick="saveSchedule()">Save Event</button>
            </div>
        </div>
    </div>
    
    <div id="taskModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header"><h2>Add Task</h2><button class="close-btn" onclick="closeModal('taskModal')">✕</button></div>
            <div class="form-group"><label>Task Name</label><input type="text" id="task-name" class="form-input" placeholder="e.g., Beli tiket konser"></div>
            <div class="form-group"><label>Deadline</label><input type="date" id="task-deadline" class="form-input"></div>
            <div class="form-group"><label>Priority</label>
                <select id="task-priority" class="form-input">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('taskModal')">Cancel</button>
                <button class="btn-submit" onclick="saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
