<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal &amp; tugas · マネージャー</title>
    <script>(function(){var t;try{t=localStorage.getItem('zen-theme');}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'sumi':'washi');})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/zen.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <canvas class="petals" aria-hidden="true"></canvas>

    <nav class="rail" aria-label="Menu utama">
        <a href="index.html" class="rail-logo" lang="ja" aria-label="マネージャー, ke halaman Keuangan">マネージャー</a>
        <div class="rail-links">
            <a href="index.html" class="rail-link" aria-label="Keuangan" data-tip="Keuangan"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg></a>
            <a href="schedule.html" class="rail-link" aria-current="page" aria-label="Jadwal &amp; tugas" data-tip="Jadwal &amp; tugas"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg></a>
            <a href="wishlist.html" class="rail-link" aria-label="Wishlist" data-tip="Wishlist"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg></a>
            <a href="hobbies.html" class="rail-link" aria-label="Hobi" data-tip="Hobi"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg></a>
            <a href="dumpspaces.html" class="rail-link" aria-label="Dumpspaces" data-tip="Dumpspaces"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg></a>
            <a href="minigames.html" class="rail-link" aria-label="Sudoku" data-tip="Sudoku"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg></a>
        </div>
        <div class="rail-tools">
            <button type="button" class="tool-btn" id="btn-motion" aria-label="Gerak" data-tip="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals" aria-label="Kelopak" data-tip="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme" aria-label="Ganti ke mode malam" data-tip="Mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout" aria-label="Keluar" data-tip="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </nav>

    <header class="mobile-bar">
        <a href="index.html" class="mobile-logo" lang="ja">マネージャー</a>
        <div class="mobile-tools">
            <button type="button" class="tool-btn" id="btn-motion-m" aria-label="Gerak"><svg aria-hidden="true"><use href="img/icons.svg#wind"/></svg></button>
            <button type="button" class="tool-btn" id="btn-petals-m" aria-label="Kelopak"><svg aria-hidden="true"><use href="img/icons.svg#petal"/></svg></button>
            <button type="button" class="tool-btn" id="btn-theme-m" aria-label="Ganti ke mode malam"><svg aria-hidden="true"><use href="img/icons.svg#moon"/></svg></button>
            <button type="button" class="tool-btn" id="btn-logout-m" aria-label="Keluar"><svg aria-hidden="true"><use href="img/icons.svg#noren"/></svg></button>
        </div>
    </header>

    <nav class="tabbar" aria-label="Menu utama">
        <a href="index.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#money"/></svg><span>Keuangan</span></a>
        <a href="schedule.html" class="tab" aria-current="page"><svg aria-hidden="true"><use href="img/icons.svg#calendar"/></svg><span>Jadwal</span></a>
        <a href="wishlist.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#ema"/></svg><span>Wishlist</span></a>
        <a href="hobbies.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#kendama"/></svg><span>Hobi</span></a>
        <a href="dumpspaces.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#scroll"/></svg><span>Dumps</span></a>
        <a href="minigames.html" class="tab"><svg aria-hidden="true"><use href="img/icons.svg#soroban"/></svg><span>Sudoku</span></a>
    </nav>


    <main class="main-content" id="main">
        <span class="watermark" lang="ja" aria-hidden="true">予</span>
        <header class="page-head">
            <div class="page-title">
                <p class="eyebrow" id="page-eyebrow">Jadwal</p>
                <h1>Jadwal &amp; tugas</h1>
                <p class="page-lede">Satu-satu aja. Yang penting ga ada yang kelupaan.</p>
            </div>
            <span class="tategaki" lang="ja" aria-hidden="true">一日一歩</span>
            <button type="button" class="btn-add" onclick="openModal('scheduleModal')">+ Tambah jadwal</button>
        </header>

        <div class="content-grid">
            <section class="box" aria-labelledby="month-display">
                <div class="calendar-header-nav">
                    <h2 id="month-display" aria-live="polite">Kalender</h2>
                    <div>
                        <button type="button" class="nav-btn" onclick="changeMonth(-1)" aria-label="Bulan sebelumnya"><span aria-hidden="true">‹</span></button>
                        <button type="button" class="nav-btn" onclick="changeMonth(1)" aria-label="Bulan berikutnya"><span aria-hidden="true">›</span></button>
                    </div>
                </div>
                <div class="calendar-grid" aria-hidden="true">
                    <div class="day-name">Min</div><div class="day-name">Sen</div><div class="day-name">Sel</div>
                    <div class="day-name">Rab</div><div class="day-name">Kam</div><div class="day-name">Jum</div><div class="day-name">Sab</div>
                </div>
                <div class="calendar-grid" id="calendar-days"></div>
            </section>

            <div class="stack">
                <section class="box" aria-labelledby="today-heading">
                    <div class="box-header"><h2 id="today-heading">Jadwal hari ini</h2></div>
                    <div id="upcoming-list"></div>
                </section>

                <section class="box" aria-labelledby="task-heading">
                    <div class="box-header">
                        <h2 id="task-heading">Daftar tugas</h2>
                        <button type="button" class="btn-small" onclick="openModal('taskModal')">+ Tugas</button>
                    </div>
                    <div id="task-list"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="dailyModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="daily-modal-title">
            <div class="modal-header">
                <h2 id="daily-modal-title">Jadwal</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('dailyModal')"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="daily-schedule-list"></div>
            <div class="modal-actions">
                <button type="button" class="btn-submit btn-block" onclick="openAddFromDaily()">+ Tambah jadwal di tanggal ini</button>
            </div>
        </div>
    </div>

    <div id="scheduleModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
            <div class="modal-header"><h2 id="schedule-modal-title">Tambah jadwal</h2><button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('scheduleModal')"><span aria-hidden="true">✕</span></button></div>
            <div class="form-group"><label for="sch-title">Nama acara</label><input type="text" id="sch-title" class="form-input" placeholder="Misal: ketemu dosen"></div>
            <div class="form-row">
                <div class="form-group"><label for="sch-date">Tanggal</label><input type="date" id="sch-date" class="form-input"></div>
                <div class="form-group"><label for="sch-time">Jam</label><input type="time" id="sch-time" class="form-input"></div>
            </div>
            <div class="form-group"><label for="sch-priority">Prioritas</label>
                <select id="sch-priority" class="form-input">
                    <option value="High">Tinggi</option>
                    <option value="Medium" selected>Sedang</option>
                    <option value="Low">Rendah</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('scheduleModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-schedule" onclick="saveSchedule()">Simpan jadwal</button>
            </div>
        </div>
    </div>

    <div id="taskModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <div class="modal-header"><h2 id="task-modal-title">Tambah tugas</h2><button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('taskModal')"><span aria-hidden="true">✕</span></button></div>
            <div class="form-group"><label for="task-name">Nama tugas</label><input type="text" id="task-name" class="form-input" placeholder="Misal: beli tiket konser"></div>
            <div class="form-group"><label for="task-deadline">Deadline</label><input type="date" id="task-deadline" class="form-input"></div>
            <div class="form-group"><label for="task-priority">Prioritas</label>
                <select id="task-priority" class="form-input">
                    <option value="High">Tinggi</option>
                    <option value="Medium" selected>Sedang</option>
                    <option value="Low">Rendah</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('taskModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-task" onclick="saveTask()">Simpan tugas</button>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/theme.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/petals.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/schedule.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
</body>
</html>
