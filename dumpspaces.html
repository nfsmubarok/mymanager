<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マネージャー Dashboard - Money</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar">
        <div class="logo">マネージャー</div>
        
        <div class="menu-group">
            <div class="menu-title">Main Dashboard</div>
            <a href="index.html" class="menu-item">Money Manager</a>
            <a href="schedule.html" class="menu-item">Schedule & Planner</a>
            <a href="wishlist.html" class="menu-item">Wishlist Tracker</a>
        </div>
        
        <div class="menu-group">
            <div class="menu-title">Leisure & Notes</div>
            <a href="hobbies.html" class="menu-item">My Hobbies</a>
            <a href="dumpspaces.html" class="menu-item active">Dumpspaces</a>
            <a href="minigames.html" class="menu-item">Mini Games</a>
        </div>

        <div style="margin-top: auto; padding: 0 24px;">
            <button onclick="logout()" style="width: 100%; background: var(--sakura-pink); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(217, 140, 140, 0.2);">
                Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Dumpspaces</h1>
                <p>Dump your thoughts, links, and inspirations here.</p>
            </div>
            <button class="btn-add" onclick="openDumpModal()">+ Add Dump</button>
        </div>
        

        <div class="masonry-grid" id="dumps-container">
            </div>
    </div>

    <div id="dumpModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Dump</h2>
                <button class="close-btn" onclick="closeModal('dumpModal')">✕</button>
            </div>
            
            <div class="form-group">
                <label>Type of Dump</label>
                <select id="dump-type" class="form-input" onchange="toggleDumpFields()">
                    <option value="Note">📝 Text / Note</option>
                    <option value="Link">🔗 Web Link</option>
                    <option value="Image">🖼️ Upload Image</option>
                </select>
            </div>

            <div class="form-group">
                <label id="label-title">Title (Optional)</label>
                <input type="text" id="dump-title" class="form-input" placeholder="Give it a title...">
            </div>

            <div class="form-group" id="field-note">
                <label>Note Content</label>
                <textarea id="dump-content" class="form-input" rows="6" placeholder="Tulis ide, *snippet code*, atau catatan disini..."></textarea>
            </div>

            <div class="form-group" id="field-link" style="display: none;">
                <label>URL / Link</label>
                <input type="url" id="dump-url" class="form-input" placeholder="https://...">
            </div>

            <div class="form-group" id="field-image" style="display: none;">
                <label>Upload Image from Device</label>
                <input type="file" id="dump-file" class="form-input" accept="image/*">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('dumpModal')">Cancel</button>
                <button class="btn-submit" id="btn-save-dump" onclick="saveDump()">Drop it!</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay" style="z-index: 1001;">
        <div class="modal-content" style="width: 350px; text-align: center; padding: 40px 30px;">
            <div style="font-size: 32px; margin-bottom: 10px;">🗑️</div>
            <h3 style="margin-bottom: 10px; color: var(--text-dark); font-size: 18px;">Are you sure?</h3>
            <p id="confirm-msg" style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">Yakin mau hapus dump ini?</p>
            <div style="display: flex; justify-content: center; gap: 12px;">
                <button class="btn-cancel" onclick="closeModal('confirmModal')">Cancel</button>
                <button class="btn-submit" style="background-color: var(--sakura-pink);" onclick="executeConfirm()">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="toast" style="position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: var(--text-dark); color: white; padding: 12px 24px; border-radius: 8px; transition: 0.3s; opacity: 0; z-index: 2000; font-size: 14px; font-weight: bold;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1. INIT SUPABASE 
        const supabaseUrl = 'https://pbvjxiyijesakcnywgdv.supabase.co';
        const supabaseKey = 'sb_publishable_2yVPX7xdB2PnDNR3Pi4R-A_acaqtDH3';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let dumps = JSON.parse(localStorage.getItem('finzen_dumps')) || [];
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.bottom = '30px'; t.style.opacity = '1';
            setTimeout(() => { t.style.bottom = '-50px'; t.style.opacity = '0'; }, 3000);
        }

        // --- RENDER UI ---
        function renderDumps() {
            const container = document.getElementById('dumps-container');
            container.innerHTML = '';

            if (dumps.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span style="font-size: 24px; display: block; margin-bottom: 10px;">📦</span>
                        Masih kosong. Mulai buang link, ide, atau gambar lu kesini!
                    </div>`;
                return;
            }

            dumps.sort((a,b) => b.id - a.id);

            dumps.forEach(dump => {
                let badgeClass = '';
                let contentHtml = '';
                let titleHtml = dump.title ? `<h4 class="dump-title">${dump.title}</h4>` : '';
                
                if (dump.type === 'Note') {
                    badgeClass = 'type-note';
                    contentHtml = `<p class="dump-text">${dump.content}</p>`;
                } 
                else if (dump.type === 'Link') {
                    badgeClass = 'type-link';
                    contentHtml = `<a href="${dump.url}" target="_blank" class="dump-link">🔗 Visit Link ↗</a>`;
                    if(dump.content) contentHtml = `<p class="dump-text" style="margin-bottom:8px;">${dump.content}</p>` + contentHtml;
                } 
                else if (dump.type === 'Image') {
                    badgeClass = 'type-image';
                    contentHtml = ''; 
                }

                container.innerHTML += `
                    <div class="dump-card">
                        ${dump.type === 'Image' ? `<img src="${dump.url}" alt="Dumped Image" class="dump-image" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Not+Found'">` : ''}
                        
                        <div class="dump-header">
                            <span class="dump-type-badge ${badgeClass}">${dump.type}</span>
                            <button class="btn-delete-card" onclick="triggerDeleteDump(${dump.id})" title="Delete Dump">🗑️</button>
                        </div>
                        
                        <div class="dump-body">
                            ${titleHtml}
                            ${contentHtml}
                            ${dump.type === 'Image' && dump.content ? `<p class="dump-text" style="margin-top:8px;">${dump.content}</p>` : ''}
                            <p style="font-size: 10px; color: var(--border-color); margin-top: 12px; text-align: right;">${dump.date}</p>
                        </div>
                    </div>
                `;
            });
        }

        // --- FORM & MODAL LOGIC ---
        function toggleDumpFields() {
            const type = document.getElementById('dump-type').value;
            document.getElementById('field-note').style.display = 'none';
            document.getElementById('field-link').style.display = 'none';
            document.getElementById('field-image').style.display = 'none';
            document.getElementById('label-title').innerText = "Title (Optional)";

            if (type === 'Note') {
                document.getElementById('field-note').style.display = 'block';
            } else if (type === 'Link') {
                document.getElementById('field-link').style.display = 'block';
                document.getElementById('field-note').style.display = 'block';
                document.getElementById('label-title').innerText = "Link Title";
            } else if (type === 'Image') {
                document.getElementById('field-image').style.display = 'block';
                document.getElementById('field-note').style.display = 'block';
                document.getElementById('label-title').innerText = "Caption / Title (Optional)";
            }
        }

        function openDumpModal() {
            document.getElementById('dump-title').value = '';
            document.getElementById('dump-content').value = '';
            document.getElementById('dump-url').value = '';
            document.getElementById('dump-image-file').value = '';
            document.getElementById('dump-type').value = 'Note';
            toggleDumpFields();
            openModal('dumpModal');
        }

        async function saveDump() {
            const btn = document.querySelector('.btn-submit');
            const type = document.getElementById('dump-type').value;
            const title = document.getElementById('dump-title').value;
            const content = document.getElementById('dump-content').value;
            const today = new Date();
            const dateStr = today.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
            
            let finalUrl = '';
            
            if(type === 'Note' && !title && !content) { alert("Isi notesnya dong!"); return; }
            if(type === 'Link') {
                finalUrl = document.getElementById('dump-url').value;
                if(!finalUrl) { alert("URL Linknya jangan kosong!"); return; }
            }

            btn.innerText = "Saving..."; btn.disabled = true;

            // Logic khusus Image Upload
            if(type === 'Image') {
                const fileInput = document.getElementById('dump-image-file');
                if(!fileInput.files || fileInput.files.length === 0) {
                    alert("Pilih gambarnya dulu coy!"); btn.innerText = "Drop it!"; btn.disabled = false; return;
                }
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                // 1. Upload ke Storage "dumps-images"
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('dumps-images')
                    .upload(fileName, file);

                if(uploadError) {
                    console.error(uploadError); alert("Gagal upload gambar ke cloud!"); 
                    btn.innerText = "Drop it!"; btn.disabled = false; return;
                }

                // 2. Ambil Public URL
                const { data: publicUrlData } = supabaseClient.storage
                    .from('dumps-images')
                    .getPublicUrl(fileName);

                finalUrl = publicUrlData.publicUrl;
            }

            const payload = { type, title, content, url: finalUrl, date: dateStr };

            // 3. Simpan data ke Database
            const { error: dbError } = await supabaseClient
                .from('dumpspaces')
                .insert([payload]);

            if (dbError) {
                console.error(dbError); alert("Gagal simpan ke database!");
                btn.innerText = "Drop it!"; btn.disabled = false; return;
            }

            payload.id = Date.now();
            dumps.push(payload);
            localStorage.setItem('finzen_dumps', JSON.stringify(dumps));
            
            btn.innerText = "Drop it!"; btn.disabled = false;
            closeModal('dumpModal');
            showToast("Dump saved successfully!");
            renderDumps();
        }

        // --- DELETE LOGIC ---
        let confirmAction = null; 
        function customConfirm(message, actionCallback) {
            document.getElementById('confirm-msg').innerText = message;
            confirmAction = actionCallback; 
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function executeConfirm() {
            if(confirmAction) { confirmAction(); confirmAction = null; }
            closeModal('confirmModal');
        }

        function triggerDeleteDump(id) {
            customConfirm(`Yakin mau ngebuang dump ini selamanya?`, async () => {
                const { error } = await supabaseClient.from('dumpspaces').delete().eq('id', id);
                if(error) { alert("Gagal hapus dari cloud!"); return; }

                dumps = dumps.filter(d => d.id !== id);
                localStorage.setItem('finzen_dumps', JSON.stringify(dumps));
                renderDumps();
                showToast("Dump deleted!");
            });
        }

        function openModal(modalId) { document.getElementById(modalId).style.display = 'flex'; }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }
        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) { event.target.style.display = "none"; } }

        window.onload = () => { renderDumps(); };
                // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html'; // Usir ke halaman login
            }
        }
// --- FUNGSI NARIK DATA DARI CLOUD ---
        async function fetchCloudData() {
            // 1. Ambil data wallets dari Supabase
            const { data: dbWallets } = await supabaseClient.from('wallets').select('*');
            if (dbWallets && dbWallets.length > 0) {
                wallets = dbWallets;
                localStorage.setItem('finzen_wallets', JSON.stringify(wallets));
            }

            // 2. Ambil data transactions dari Supabase
            const { data: dbTx } = await supabaseClient.from('transactions').select('*');
            if (dbTx) {
                transactions = dbTx;
                localStorage.setItem('finzen_tx', JSON.stringify(transactions));
            }

            // 3. Render layarnya
            updateDashboard();
        }

        // --- SISTEM GEMBOK LOGIN ---
        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
            } else {
                // KALAU SUDAH LOGIN, TARIK DATA DARI CLOUD!
                fetchCloudData();
            }
        }

        // Jalankan pas halaman dibuka
        window.onload = () => { 
            document.getElementById('filter-month').value = new Date().getMonth();
            checkAuth(); 
        };
        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        // Panggil checkAuth pas halaman dibuka
        checkAuth();
    </script>
    
</body>
</html>
