<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumpspaces · マネージャー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Langsung ke konten</a>

    <aside class="sidebar">
        <div class="logo" lang="ja">マネージャー</div>
        <nav aria-label="Menu utama">
            <div class="menu-group">
                <p class="menu-title">Harian</p>
                <a href="index.html" class="menu-item">Keuangan</a>
                <a href="schedule.html" class="menu-item">Jadwal &amp; tugas</a>
                <a href="wishlist.html" class="menu-item">Wishlist</a>
            </div>
            <div class="menu-group">
                <p class="menu-title">Santai &amp; catatan</p>
                <a href="hobbies.html" class="menu-item">Hobi</a>
                <a href="dumpspaces.html" class="menu-item active" aria-current="page">Dumpspaces</a>
                <a href="minigames.html" class="menu-item">Sudoku</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-logout" id="btn-logout">Keluar</button>
        </div>
    </aside>

    <main class="main-content" id="main">
        <header class="header">
            <div>
                <h1>Dumpspaces <span class="jp" lang="ja" aria-hidden="true">メモ</span></h1>
                <p>Tempat buang ide, link, sama gambar biar ga numpuk di kepala.</p>
            </div>
            <button type="button" class="btn-add" onclick="openDumpModal()">+ Buang sesuatu</button>
        </header>

        <div class="masonry-grid" id="dumps-container"></div>
    </main>

    <div id="dumpModal" class="modal-overlay">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="dump-modal-title">
            <div class="modal-header">
                <h2 id="dump-modal-title">Dump baru</h2>
                <button type="button" class="close-btn" aria-label="Tutup" onclick="closeModal('dumpModal')"><span aria-hidden="true">✕</span></button>
            </div>

            <div class="form-group">
                <label for="dump-type">Jenis</label>
                <select id="dump-type" class="form-input" onchange="toggleDumpFields()">
                    <option value="Note">Catatan</option>
                    <option value="Link">Link</option>
                    <option value="Image">Gambar</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dump-title" id="label-title">Judul (opsional)</label>
                <input type="text" id="dump-title" class="form-input">
            </div>

            <div class="form-group" id="field-link" hidden>
                <label for="dump-url">URL</label>
                <input type="url" id="dump-url" class="form-input" placeholder="https://...">
            </div>

            <div class="form-group" id="field-image" hidden>
                <label for="dump-file">Pilih gambar dari perangkat</label>
                <input type="file" id="dump-file" class="form-input" accept="image/*">
            </div>

            <div class="form-group" id="field-note">
                <label for="dump-content" id="label-content">Isi catatan</label>
                <textarea id="dump-content" class="form-input" rows="6" placeholder="Ide, potongan kode, atau apa aja"></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeModal('dumpModal')">Batal</button>
                <button type="button" class="btn-submit" id="btn-save-dump" onclick="saveDump()">Simpan</button>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dumpspaces.js"></script>
</body>
</html>
